name: Build Instagram Unified Login v1.21 images

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/instagram-unified-v1.21

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: builder
            dockerfile: apps/builder/docker/Dockerfile
          - image: worker
            dockerfile: apps/worker/docker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatbotx-${{ matrix.image }}:instagram-unified-v1.21
            ghcr.io/${{ github.repository_owner }}/chatbotx-${{ matrix.image }}:instagram-unified-v1.21-${{ github.sha }}
          cache-from: type=gha,scope=v1.21-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=v1.21-${{ matrix.image }}
